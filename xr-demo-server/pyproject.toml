[project]
name = "xr-demo-server"
version = "0.1.0"
description = "WebSocket proxy for the Godot XR demo assistant."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "google-genai>=1.0.0",
  "langchain-core>=1.0.0,<2.0.0",
  "pydantic-settings>=2.3.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
